# Local environment (ADR-0004): one command starts the database, the migration, the backend and the frontend.
#   cp .env.example .env
#   docker compose up --build
# Ports are bound to 127.0.0.1 only.
# The embedding service runs locally (ADR-0006); its model is downloaded once by `ollama-model`.

services:
  tools-db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - tools-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: downloads the embedding model once; after that everything runs without internet.
  ollama-model:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: ollama:11434
    command: ["pull", "${EMBEDDING_MODEL:-bge-m3}"]
    depends_on:
      ollama:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@tools-db:5432/${POSTGRES_DB}
      EMBEDDING_URL: ${EMBEDDING_URL:-http://ollama:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
    depends_on:
      tools-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_TARGET: http://backend:8000
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  tools-db-data:
  ollama-models:

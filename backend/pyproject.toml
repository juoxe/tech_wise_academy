[project]
name = "tech-wise-academy-backend"
version = "0.1.0"
description = "Backend of Tech Wise Academy"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.128.0,<0.129.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.46,<3.0.0",
    "psycopg[binary]>=3.3.2,<4.0.0",
    "alembic>=1.18.1,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "ruff>=0.14.14,<0.15.0",
    "ty>=0.0.13,<0.0.14",
    "import-linter>=2.0,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tech_wise_academy"]

[tool.uv]
add-bounds = "major"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.importlinter]
root_package = "tech_wise_academy"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Learning content layers: api > service > repository > model"
type = "layers"
layers = [
    "tech_wise_academy.learning_content.api",
    "tech_wise_academy.learning_content.service",
    "tech_wise_academy.learning_content.repository",
    "tech_wise_academy.learning_content.model",
]

[[tool.importlinter.contracts]]
name = "Domain model is free of frameworks"
type = "forbidden"
source_modules = ["tech_wise_academy.learning_content.model"]
forbidden_modules = ["fastapi", "sqlalchemy", "pydantic", "pydantic_settings", "alembic"]

[[tool.importlinter.contracts]]
name = "Training layers: api > service > repository > model"
type = "layers"
layers = [
    "tech_wise_academy.training.api",
    "tech_wise_academy.training.service",
    "tech_wise_academy.training.repository",
    "tech_wise_academy.training.model",
]
